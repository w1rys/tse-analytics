[project]
name = "tse-analytics"
version = "0.1.0"
description = ""
authors = [
    { name = "w1rys", email = "wirysbmendes@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "pandas>=2.2,<3.0",
    "requests>=2.34.2,<3.0.0",
    "rich>=15.0.0,<16.0.0",
    "tqdm>=4.69.0,<5.0.0",
    "pyspark>=4.1.1,<4.1.2",
    "delta-spark>=4.3.1,<4.4.0",
    "matplotlib>=3.11.1,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "jupyterlab>=4.0,<5.0",
    "notebook>=7.0,<8.0"
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0,<8.0.0"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"